<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#7f1427">
<title>Santé du portail | Cardinal-Roy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--burgundy:#7f1427;--dark:#5b0e1b;--red:#b61b2a;--paper:#fffdf9;--canvas:#f7f2ed;--line:#ded3d0;--muted:#6d6464;--good:#486222;--warn:#8b4a11}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:#2a2525;font-family:"IBM Plex Sans","Segoe UI",sans-serif;line-height:1.45}body:before{content:"";display:block;height:6px;background:var(--red)}
header{background:var(--burgundy);color:#fff;padding:28px 0}.page{width:min(1180px,calc(100% - 36px));margin:auto}h1,h2{font-family:"IBM Plex Serif",Georgia,serif}h1{margin:0;font-size:2rem}header p{margin:5px 0 0;color:#f1dfe3}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid rgba(255,255,255,.45);border-radius:8px;background:rgba(255,255,255,.1);color:#fff;padding:7px 11px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}.btn:hover{background:rgba(255,255,255,.18)}main{padding:28px 0 60px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.metric strong{display:block;font-size:1.7rem;color:var(--burgundy)}.metric span{font-size:.82rem;color:var(--muted)}.section{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.section h2{margin:0 0 12px;font-size:1.25rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.good{color:var(--good);font-weight:700}.warn{color:var(--warn);font-weight:700}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee6e3;vertical-align:top}th{color:#554a4c;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}td.num{text-align:right;font-variant-numeric:tabular-nums}ul{margin:8px 0;padding-left:20px}code{font-size:.82em;overflow-wrap:anywhere}.empty{color:var(--good);font-weight:650}.note{margin-top:10px;padding:10px 12px;border-radius:8px;background:#faf5f6;color:#5b5052;font-size:.82rem}.resource-link{color:var(--burgundy);font-weight:650}.hidden-frame{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10000px;top:-10000px}
@media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="page"><h1>Santé du portail Cardinal-Roy</h1><p>Audit technique du registre, de la recherche et de l’utilisation du portail.</p><div class="toolbar"><button class="btn" id="refresh-status" type="button">Actualiser</button><button class="btn" id="clear-analytics" type="button">Effacer les statistiques locales</button><a class="btn" href="./">Ouvrir le portail</a></div></div></header>
<main class="page"><div id="admin-status"><p>Chargement du portail pour l’audit…</p></div></main>
<iframe class="hidden-frame" id="portal-health-frame" src="./?health=1" title="Portail chargé pour l’audit" aria-hidden="true"></iframe>
<script src="admin-status.js?v=20260907"></script>
<script src="admin-global-analytics.js?v=20260907-1510"></script>
</body>
</html>
