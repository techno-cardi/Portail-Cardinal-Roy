name: Vérifier les liens Drive d’évaluation

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'evaluation-drive-links.js'
      - 'evaluation-search-direct.js'
      - 'tests/evaluation-drive-links.spec.js'
      - '.github/workflows/verify-evaluation-drive-links.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Liens Drive visibles
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm install
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Vérifier les ressources directes dans le rendu final
        run: npx playwright test tests/evaluation-drive-links.spec.js --project=desktop-chromium --reporter=line
