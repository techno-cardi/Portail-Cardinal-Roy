name: Déployer les analytics Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/portal-analytics/**'
      - 'supabase/migrations/*portal_analytics*.sql'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-analytics.yml'

permissions:
  contents: read

concurrency:
  group: deploy-supabase-analytics
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ojyswaxuqwnqilrvtjll

    steps:
      - name: Vérifier le secret Supabase
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Le secret GitHub SUPABASE_ACCESS_TOKEN est absent."
            exit 1
          fi

      - name: Récupérer le dépôt
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Appliquer les migrations analytics
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*portal_analytics*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Aucune migration analytics à appliquer."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Application de $file"
            payload=$(jq -Rs '{query: .}' < "$file")
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary "$payload" >/dev/null
          done

      - name: Déployer portal-analytics
        run: supabase functions deploy portal-analytics --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt

      - name: Vérifier que la fonction répond
        shell: bash
        run: |
          sleep 5
          curl --fail-with-body --silent --show-error \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/portal-analytics?days=1" \
            -H 'Accept: application/json'
