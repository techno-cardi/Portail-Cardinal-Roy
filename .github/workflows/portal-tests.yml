name: Tests du portail

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'body-part-*.txt'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/portal-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
            label: Chrome desktop
          - project: desktop-firefox
            browser: firefox
            label: Firefox desktop
          - project: desktop-webkit
            browser: webkit
            label: Safari / WebKit desktop
          - project: mobile-chromium
            browser: chromium
            label: Android / Chromium
          - project: mobile-webkit
            browser: webkit
            label: iOS / WebKit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Installer le navigateur de test
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Tester ${{ matrix.label }}
        run: npx playwright test --project="${{ matrix.project }}"
