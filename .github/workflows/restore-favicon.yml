name: Protéger l’icône et le halo du portail

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'favicon.ico'
      - 'portal-critical.css'
      - '.github/workflows/restore-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect:
    name: Vérifier les éléments visuels critiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurer et verrouiller les éléments critiques
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import pathlib
          import re
          import subprocess

          historical_commit = '22d1d0f1d4c167a6ff88443220233c765a94ee87'
          old_index = subprocess.check_output(
              ['git', 'show', f'{historical_commit}:index.html'],
              text=True,
          )
          match = re.search(
              r'<link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,([^"]+)">',
              old_index,
          )
          if not match:
              raise SystemExit('Favicon historique introuvable dans le commit de référence.')

          favicon = pathlib.Path('favicon.ico')
          expected_favicon = base64.b64decode(match.group(1))
          if not favicon.exists() or favicon.read_bytes() != expected_favicon:
              favicon.write_bytes(expected_favicon)

          critical = pathlib.Path('portal-critical.css')
          if not critical.exists():
              critical.write_text(r'''/* Garde-fou visuel critique du Portail Cardinal-Roy. */
.procedure.portal-search-flash,
.subresource-search-target.portal-search-flash{
  position:relative!important;
  z-index:4!important;
  border-radius:14px!important;
  overflow:visible!important;
  animation:cardiSearchGlowCritical 2.65s cubic-bezier(.22,.72,.24,1) both!important;
  will-change:box-shadow,background-color,border-color;
}
@keyframes cardiSearchGlowCritical{
  0%{box-shadow:0 0 0 0 rgba(127,20,39,0),0 0 0 rgba(127,20,39,0);border-color:inherit;background-color:inherit}
  10%{box-shadow:0 0 0 5px rgba(127,20,39,.34),0 10px 28px rgba(91,14,27,.20);border-color:#7f1427;background-color:#fff1f4}
  25%{box-shadow:0 0 0 10px rgba(127,20,39,.11),0 7px 20px rgba(91,14,27,.12);border-color:#bd7f8e;background-color:#fff9fa}
  40%{box-shadow:0 0 0 3px rgba(127,20,39,.30),0 11px 30px rgba(91,14,27,.18);border-color:#7f1427;background-color:#fff3f6}
  58%{box-shadow:0 0 0 8px rgba(127,20,39,.09),0 5px 16px rgba(91,14,27,.09);border-color:#c99da8;background-color:#fffafb}
  100%{box-shadow:0 0 0 0 rgba(127,20,39,0),0 0 0 rgba(127,20,39,0);border-color:inherit;background-color:inherit}
}
@media(prefers-reduced-motion:reduce){
  .procedure.portal-search-flash,.subresource-search-target.portal-search-flash{
    animation:none!important;outline:4px solid rgba(127,20,39,.42)!important;outline-offset:4px!important;border-radius:14px!important
  }
}
''', encoding='utf-8')

          fav_hash = hashlib.sha256(favicon.read_bytes()).hexdigest()[:12]
          css_hash = hashlib.sha256(critical.read_bytes()).hexdigest()[:12]

          index_path = pathlib.Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          index = re.sub(
              r'\n?<link\s+[^>]*rel=["\'](?:shortcut\s+)?icon["\'][^>]*>',
              '',
              index,
              flags=re.IGNORECASE,
          )
          favicon_tag = f'<link rel="icon" type="image/x-icon" href="favicon.ico?v={fav_hash}">'
          index, count = re.subn(
              r'(<title>.*?</title>)',
              r'\1\n' + favicon_tag,
              index,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('Balise <title> introuvable dans index.html.')

          index = re.sub(
              r'\n?<link\s+[^>]*href=["\']portal-critical\.css(?:\?[^"\']*)?["\'][^>]*>',
              '',
              index,
              flags=re.IGNORECASE,
          )
          critical_tag = f'<link rel="stylesheet" href="portal-critical.css?v={css_hash}">'
          if '</head>' not in index:
              raise SystemExit('Balise </head> introuvable dans index.html.')
          index = index.replace('</head>', critical_tag + '\n</head>', 1)

          if "loadScript('global-search-flash.js')" not in index:
              marker = "    await loadScript('evaluation-search-direct.js');"
              if marker in index:
                  index = index.replace(marker, "    await loadScript('global-search-flash.js');\n" + marker, 1)
              else:
                  raise SystemExit('Point d’insertion du moteur de recherche introuvable.')

          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Publier les réparations seulement si nécessaire
        shell: bash
        run: |
          if git diff --quiet -- index.html favicon.ico portal-critical.css && \
             git ls-files --error-unmatch favicon.ico >/dev/null 2>&1 && \
             git ls-files --error-unmatch portal-critical.css >/dev/null 2>&1; then
            echo "L’icône et le halo sont déjà intacts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.ico portal-critical.css
          git commit -m "Réparer automatiquement l’icône et le halo du portail"
          git push
