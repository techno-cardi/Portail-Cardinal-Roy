name: Protéger l’icône et le halo du portail

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'favicon.ico'
      - 'portal-critical.css'
      - '.github/workflows/restore-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect:
    name: Vérifier les éléments visuels critiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurer les fichiers critiques s’ils manquent
        shell: bash
        run: |
          if [ ! -f favicon.ico ]; then
            git show d2702a026a8e13b6d711278a76f1256c5ffd68a9:favicon.ico > favicon.ico
          fi
          if [ ! -f portal-critical.css ]; then
            git show cc0853aebd14dff8940193a7c04678a340d973d3:portal-critical.css > portal-critical.css
          fi

      - name: Vérifier et réparer les références dans index.html
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import re

          index_path = pathlib.Path('index.html')
          favicon_path = pathlib.Path('favicon.ico')
          critical_path = pathlib.Path('portal-critical.css')

          index = index_path.read_text(encoding='utf-8')
          fav_hash = hashlib.sha256(favicon_path.read_bytes()).hexdigest()[:12]
          css_hash = hashlib.sha256(critical_path.read_bytes()).hexdigest()[:12]

          index = re.sub(
              r'\n?<link\s+[^>]*rel=["\'](?:shortcut\s+)?icon["\'][^>]*>',
              '',
              index,
              flags=re.IGNORECASE,
          )
          favicon_tag = f'<link rel="icon" type="image/x-icon" href="favicon.ico?v={fav_hash}">'
          index, count = re.subn(
              r'(<title>.*?</title>)',
              r'\1\n' + favicon_tag,
              index,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('Balise <title> introuvable dans index.html.')

          index = re.sub(
              r'\n?<link\s+[^>]*href=["\']portal-critical\.css(?:\?[^"\']*)?["\'][^>]*>',
              '',
              index,
              flags=re.IGNORECASE,
          )
          critical_tag = f'<link rel="stylesheet" href="portal-critical.css?v={css_hash}">'
          if '</head>' not in index:
              raise SystemExit('Balise </head> introuvable dans index.html.')
          index = index.replace('</head>', critical_tag + '\n</head>', 1)

          if "loadScript('global-search-flash.js')" not in index:
              marker = "    await loadScript('evaluation-search-direct.js');"
              if marker not in index:
                  raise SystemExit('Point d’insertion du moteur de recherche introuvable.')
              index = index.replace(
                  marker,
                  "    await loadScript('global-search-flash.js');\n" + marker,
                  1,
              )

          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Valider le halo critique
        shell: bash
        run: |
          grep -q 'border-radius:14px!important' portal-critical.css
          grep -q 'cardiSearchGlowCritical' portal-critical.css
          grep -q 'portal-critical.css' index.html
          grep -q 'favicon.ico' index.html
          grep -q "loadScript('global-search-flash.js')" index.html

      - name: Publier une réparation seulement si nécessaire
        shell: bash
        run: |
          if git diff --quiet -- index.html favicon.ico portal-critical.css && \
             git ls-files --error-unmatch favicon.ico >/dev/null 2>&1 && \
             git ls-files --error-unmatch portal-critical.css >/dev/null 2>&1; then
            echo "L’icône et le halo sont déjà intacts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.ico portal-critical.css
          git commit -m "Réparer automatiquement l’icône et le halo du portail"
          git push
