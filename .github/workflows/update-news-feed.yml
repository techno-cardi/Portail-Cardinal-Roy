name: Mise à jour des dates importantes

on:
  schedule:
    # Toutes les 15 minutes. Suffisant pour un calendrier scolaire et 66 % moins d'exécutions que l'ancien rythme de 5 minutes.
    - cron: '2-59/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_news_feed.py'
      - '.github/workflows/update-news-feed.yml'

permissions:
  contents: write

concurrency:
  group: dates-importantes-calendar-sync
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CARDINAL_CALENDAR_ICAL_URL: ${{ secrets.CARDINAL_CALENDAR_ICAL_URL }}
      CARDINAL_SCHOOL_CALENDAR_ICAL_URL: ${{ secrets.CARDINAL_SCHOOL_CALENDAR_ICAL_URL }}
    steps:
      - name: Récupérer le portail
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Se synchroniser sur la branche principale
        shell: bash
        run: git pull --ff-only origin main

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer le lecteur iCal
        run: python -m pip install --disable-pip-version-check icalendar recurring-ical-events

      - name: Mettre à jour les dates importantes
        run: python scripts/build_news_feed.py

      - name: Publier seulement si le fil a changé
        shell: bash
        run: |
          if git diff --quiet -- news-feed.json; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-feed.json
          git commit -m "Mettre à jour les dates importantes du calendrier [sans nouveauté]"
          git pull --rebase origin main
          git push origin HEAD:main
