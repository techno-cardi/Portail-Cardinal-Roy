name: Vérification des liens

on:
  schedule:
    - cron: '15 12 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'body-part-*.txt'
      - 'source-patches*.js'
      - 'after-ui.js'
      - 'ui-polish.js'
      - 'global-search-flash.js'
      - 'procedure-links.js'
      - 'depannage-resource.js'
      - 'portal-integrity.js'
      - 'search-easter-egg.js'
      - 'search-easter-eggs-extra.js'
      - 'news-ticker.js'
      - 'portal-updates-curated.json'
      - 'news-feed.json'
      - 'index.html'
      - 'scripts/check_links.py'
      - '.github/workflows/check-links.yml'

permissions:
  contents: write

concurrency:
  group: portal-link-health
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Vérifier les liens externes et locaux
        run: python scripts/check_links.py
      - name: Publier le rapport de santé
        shell: bash
        run: |
          if git diff --quiet -- link-health.json; then
            echo "Rapport inchangé."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add link-health.json
            git commit -m "Mettre à jour la santé des liens [sans nouveauté]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Échouer seulement sur un lien réellement brisé
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('link-health.json').read_text(encoding='utf-8'))
          if data.get('status') == 'broken':
              raise SystemExit('Un ou plusieurs liens sont réellement brisés. Consultez link-health.json.')
          PY
