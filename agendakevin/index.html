<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07577f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <title>Agenda</title>
  <meta name="description" content="Agenda de planification 2026-2027 adapté à l'horaire de Cardinal-Roy.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css?v=20260913-3">
  <link rel="stylesheet" href="ui-tweaks.css?v=20260914-2">
  <link rel="stylesheet" href="print.css?v=20260913-1">
</head>
<body>
  <div class="app-shell" id="appShell" hidden>
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="logo-cardinal-roy.png" alt="École Cardinal-Roy">
        <div>
          <div class="eyebrow">Cardinal-Roy · 2026-2027</div>
          <h1>Agenda</h1>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-course-button" id="courseListBtn" type="button" title="Planification par cours" aria-label="Planification par cours">Cours</button>
        <button class="icon-button" id="printBtn" type="button" title="Imprimer la semaine" aria-label="Imprimer la semaine">🖨</button>
        <button class="icon-button" id="installBtn" type="button" hidden title="Installer l'application" aria-label="Installer l'application">＋</button>
        <button class="icon-button" id="settingsBtn" type="button" title="Accès et réglages" aria-label="Accès et réglages">•••</button>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Navigation de l’agenda">
        <div class="nav-group">
          <button class="nav-button" id="prevBtn" type="button" aria-label="Période précédente">‹</button>
          <button class="today-button" id="todayBtn" type="button">Aujourd’hui</button>
          <button class="nav-button" id="nextBtn" type="button" aria-label="Période suivante">›</button>
        </div>

        <div class="period-heading">
          <div class="period-title" id="periodTitle">—</div>
          <div class="status-row">
            <button class="history-button" id="undoBtn" type="button" aria-label="Annuler" disabled>↶ <span>Annuler</span></button>
            <button class="history-button" id="redoBtn" type="button" aria-label="Rétablir" disabled>↷ <span>Rétablir</span></button>
            <div class="save-status" id="saveStatus" aria-live="polite">Prêt</div>
          </div>
        </div>

        <div class="segmented" role="group" aria-label="Mode d'affichage">
          <button type="button" data-view="day">Jour</button>
          <button type="button" data-view="week">Semaine</button>
        </div>
      </section>

      <section id="planner" class="planner" aria-live="polite"></section>
    </main>

    <footer class="footer">
      <span>Horaire 18 jours · sauvegarde automatique</span>
      <span id="networkStatus">En ligne</span>
    </footer>
  </div>

  <dialog class="access-dialog" id="accessDialog">
    <form id="accessForm" method="dialog">
      <div class="dialog-badge">CR</div>
      <h2>Ouvrir Agenda</h2>
      <p>Entre ton mot de passe une seule fois sur cet appareil. Il restera enregistré localement.</p>
      <label for="accessKey">Mot de passe</label>
      <div class="key-row">
        <input id="accessKey" name="accessKey" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
        <button type="button" id="toggleKeyBtn" class="small-button">Afficher</button>
      </div>
      <div class="dialog-error" id="accessError" aria-live="polite"></div>
      <button type="submit" class="primary-button" id="unlockBtn">Ouvrir</button>
    </form>
  </dialog>

  <dialog class="settings-dialog" id="settingsDialog">
    <form method="dialog">
      <h2>Réglages</h2>
      <p>L’Agenda se synchronise automatiquement entre tes appareils.</p>
      <button type="button" class="secondary-button" id="changePasswordBtn">Changer mon mot de passe</button>
      <button type="button" class="secondary-button" id="googleSyncBtn">Synchronisation Google Agenda</button>
      <button type="button" class="secondary-button" id="printWeekBtn">Imprimer la semaine</button>
      <button type="button" class="secondary-button" id="resetKeyBtn">Oublier le mot de passe sur cet appareil</button>
      <button type="button" class="secondary-button" id="installHelpBtn">Ajouter à l’écran d’accueil</button>
      <button type="submit" class="primary-button">Fermer</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260913-4" defer></script>
  <script src="course-meta.js?v=20260914-4" defer></script>
  <script src="planner-tools.js?v=20260913-2" defer></script>
  <script src="agenda-tools.js?v=20260913-1" defer></script>
  <script src="agenda-ui.js?v=20260914-2" defer></script>
  <script src="course-list.js?v=20260914-2" defer></script>
  <script src="google-sync-ui.js?v=20260913-2" defer></script>
  <script src="mobile-gestures.js?v=20260914-1" defer></script>
  <script src="classroom-tools.js?v=20260914-1" defer></script>
  <script src="title-edit.js?v=20260913-2" defer></script>
</body>
</html>
