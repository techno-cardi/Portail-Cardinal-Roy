<body>
<div id="legacy-source" hidden aria-hidden="true"></div>
<div id="app"></div>
<noscript><main class="page"><h1>Portail Cardinal-Roy</h1><p>JavaScript doit être activé pour consulter ce guide.</p></main></noscript>
<script>
const files=['body-part-00.txt','body-part-01.txt','body-part-02.txt','body-part-03.txt','body-part-04.txt','body-part-05.txt'];
const decodeUtf8Base64=b64=>{
  const bytes=Uint8Array.from(atob(b64.replace(/\s/g,'')),c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
};
const loadScript=src=>new Promise((resolve,reject)=>{
  const s=document.createElement('script');
  s.src=src;
  s.onload=resolve;
  s.onerror=reject;
  document.body.appendChild(s);
});
Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok) throw new Error(f); return r.text();})))
  .then(async parts=>{
    document.getElementById('legacy-source').innerHTML=decodeUtf8Base64(parts.join(''));
    await loadScript('source-patches.js');
    await loadScript('source-patches-2.js');
    await loadScript('source-patches-3.js');
    await loadScript('source-patches-4.js');
    await loadScript('assets-map.js');
    await loadScript('source-patches-5.js');
    await loadScript('source-patches-6.js');
    await loadScript('source-patches-7.js');
    await loadScript('source-patches-8.js');
    await loadScript('ui-polish.js');
    await loadScript('after-ui.js');
    await loadScript('global-search-flash.js');
  })
  .catch(error=>{
    console.error(error);
    document.getElementById('app').innerHTML='<main class="page"><h1>Portail Cardinal-Roy</h1><p>Le portail n’a pas pu être chargé. Rechargez la page pour réessayer.</p></main>';
  });
</script>
